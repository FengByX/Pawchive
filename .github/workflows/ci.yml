# Pawchive CI quality gate (ARCH-014)
#
# 合入门槛：PR 与 main 分支推送时运行
#   1. testDebugUnitTest  —— 全模块 JVM 单元测试（Robolectric）
#   2. lintDebug          —— Android Lint（error 级失败即构建失败，abortOnError 默认开启）
#   3. koverHtmlReport    —— 覆盖率报告（core+data 业务层聚合）
#   4. koverVerify        —— 覆盖率门禁（core+data line 覆盖率最低线，见各模块 build.gradle.kts）
#
# 失败时仍上传测试/lint/覆盖率报告便于定位；与本地 quality-check.ps1 命令一一对应。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate (unit tests + lint + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # gradle/actions/setup-gradle 负责 wrapper 校验、Gradle 与依赖缓存
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Lint gate
        run: ./gradlew lintDebug --console=plain

      - name: Coverage report
        run: ./gradlew koverHtmlReport --console=plain

      - name: Coverage verify
        run: ./gradlew koverVerify --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-debug.html
            **/build/reports/kover/**
          retention-days: 14
