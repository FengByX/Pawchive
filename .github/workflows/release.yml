name: Release

# 推送 v* 标签时自动构建签名 APK 并创建 GitHub Release。
# 前置：仓库 Secrets 已配置 RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD /
# RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD（密钥库不入库，.gitignore 已覆盖）。
# Secrets 缺失时回退 debug 签名并给出告警，构建不失败。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Restore release signing key
        env:
          STORE_FILE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_FILE_BASE64" ]; then
            echo "::warning::RELEASE_KEYSTORE_BASE64 未配置，本次构建回退 debug 签名"
            exit 0
          fi
          mkdir -p keystore
          echo "$STORE_FILE_BASE64" | base64 -d > keystore/release.keystore
          cat > keystore.properties <<EOF
          storeFile=keystore/release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build Release (R8)
        run: ./gradlew assembleRelease --console=plain

      - name: Resolve APK path
        id: apk
        run: |
          src="app/build/outputs/apk/release/Pawchive-v${GITHUB_REF_NAME#v}.apk"
          test -f "$src" || { echo "::error::APK 不存在：$src"; exit 1; }
          echo "path=$src" >> "$GITHUB_OUTPUT"

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r8-mapping-release
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Pawchive $GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.apk.outputs.path }}"
