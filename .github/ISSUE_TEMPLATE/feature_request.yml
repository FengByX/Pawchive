name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议 🐾 提交前请先搜索已有 issue 避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / 使用场景
      description: 描述你遇到的场景，以及现有功能为什么不满足需求
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 描述你期望的功能形态与交互
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 参考
      description: 其他 App / 网站的类似实现（如 kemono、其他第三方客户端），有截图或链接更好
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: App 版本
      description: 可选，便于判断是否为已有功能的遗漏
    validations:
      required: false
