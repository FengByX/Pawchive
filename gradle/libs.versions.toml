[versions]
agp = "9.3.2"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
retrofit = "2.9.0"
okhttp = "4.12.0"
coil = "2.6.0"
lifecycle = "2.7.0"
robolectric = "4.14.1"
activityKtx = "1.8.2"
fragmentKtx = "1.6.2"
swiperefreshlayout = "1.1.0"
workRuntime = "2.9.0"
# DI: Hilt + KSP（ARCH-003）
# AGP 9.x 内置 Kotlin 2.2.10，需使用 AGP 9 官方推荐版本：
# KSP >= 2.3.6，Hilt >= 2.59.2
ksp = "2.3.6"
hilt = "2.59.2"
hiltWork = "1.2.0"

# Room - 下载历史存储迁移（ARCH-004）
room = "2.8.4"
# 代码覆盖率（ARCH-014 质量门禁）
kover = "0.9.9"

# 其余运行时依赖（P1-1 依赖单一来源：原硬编码在 app/build.gradle.kts，现统一收口到此）
securityCrypto = "1.1.0"
datastore = "1.1.1"
viewpager2 = "1.1.0"
browser = "1.8.0"
media3 = "1.4.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Kotlin, Lifecycle & Navigation
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }

# WorkManager - 视频下载前台任务+通知栏进度
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntime" }

# Retrofit & OkHttp
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
# Gson（ARCH-FEATURE-001：feature-search 离线搜索结果反序列化）
gson = { group = "com.google.code.gson", name = "gson", version = "2.10.1" }

# Coil
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }
# Coil 动图解码（GIF / 动画 WebP / 动画 HEIF）。
# 仅加依赖不够，还必须在 ImageLoader.components 中注册 ImageDecoderDecoder，
# 见 PawchiveApplication.newImageLoader()。
coil-gif = { group = "io.coil-kt", name = "coil-gif", version.ref = "coil" }

# Testing - Robolectric（本地 JVM 运行 Android API）
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version = "1.6.1" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.6.2" }

# Hilt - 依赖注入（ARCH-003）
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }
hilt-work-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltWork" }

# Room - 下载历史存储迁移（ARCH-004）
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# 安全存储（EncryptedSharedPreferences）
# 注意：androidx.security:security-crypto 全部 API 已在 1.1.0 稳定版中弃用，
# 官方明示不再有新版本发布；1.1.0 是最终版本，后续需迁移到平台 API / Android Keystore。
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# DataStore - 键值存储
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ViewPager2 - 主页面跟手滑动切换
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }

# Chrome Custom Tabs
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }

# AndroidX Media3 (ExoPlayer)
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-cast = { group = "androidx.media3", name = "media3-cast", version.ref = "media3" }
androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# AGP 9.x 内置 Kotlin 支持，不再需要手动应用 kotlin-android 插件
# KSP + Hilt 插件（ARCH-003）
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# 代码覆盖率（ARCH-014 质量门禁）
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }




